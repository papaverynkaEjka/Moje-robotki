<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#a85d83">
<meta name="description" content="Osobisty katalog robótek ręcznych i dziennik postępów.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Moje Robótki</title>
<style>
:root{--ink:#382d35;--muted:#7c6d77;--pink:#a85d83;--pink2:#f6e8ef;--cream:#fffafc;--line:#eadde4;--green:#527b67}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8fb,#f8f1f5);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:25px 18px 20px;background:#fff9fc;border-bottom:1px solid var(--line)}.head{max-width:950px;margin:auto;display:flex;justify-content:space-between;gap:14px;align-items:center}h1{font-size:clamp(25px,5vw,34px);margin:0;color:#854565}.sub{color:var(--muted);margin:4px 0 0}.wrap{max-width:950px;margin:22px auto;padding:0 15px 50px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--pink);color:white;font-weight:650;cursor:pointer}.btn.secondary{background:var(--pink2);color:#814362}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#f8e7e7;color:#9b4545}.btn:disabled{opacity:.5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{flex:1;min-width:160px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:white;color:var(--ink);font:inherit}textarea{min-height:88px;resize:vertical}label{display:block;font-size:13px;color:var(--muted);font-weight:650;margin:0 0 6px}.field{margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}
.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #6c42500d}.cover{width:100%;height:185px;object-fit:cover;background:#f7edf2}.cardbody{padding:15px}.card h2{font-size:19px;margin:0 0 5px}.meta{font-size:13px;color:var(--muted)}.rowline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}.pill{background:var(--pink2);color:#854565;border-radius:999px;padding:4px 9px;font-size:12px}.cardbuttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.cardbuttons .btn{font-size:13px;padding:8px 11px}
.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}.panel h2{margin:0 0 14px;font-size:21px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.full{grid-column:1/-1}.hidden{display:none!important}.empty{text-align:center;padding:45px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:7px}
.progress{border-left:2px solid #ead5e0;margin:14px 0 0 7px;padding-left:17px}.entry{position:relative;padding:0 0 17px}.entry:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--pink);left:-23px;top:5px}.entryhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.entry img{max-width:180px;max-height:150px;object-fit:cover;border-radius:10px;margin-top:8px}.muted{color:var(--muted);font-size:13px}.modalback{position:fixed;inset:0;background:#2e1e29a8;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;z-index:5}.modal{width:min(700px,100%);background:var(--cream);border-radius:20px;padding:19px;margin:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h2{margin:0 0 15px}.close{border:0;background:transparent;font-size:25px;cursor:pointer;color:var(--muted)}.notice{font-size:13px;color:var(--muted);margin-top:14px}
@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{margin-top:14px}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body>
<header><div class="head"><div><h1>🧶 Moje Robótki</h1><p class="sub">Twój katalog projektów i małych postępów</p></div><div class="actions"><button class="btn" id="addBtn">＋ Nowa robótka</button></div></div></header>
<main class="wrap">
  <div class="toolbar">
    <input id="search" placeholder="Szukaj robótki…" aria-label="Szukaj robótki">
    <select id="filter" aria-label="Filtruj status"><option value="">Wszystkie statusy</option><option>W planach</option><option>W trakcie</option><option>Ukończone</option><option>Wstrzymane</option></select>
    <button class="btn secondary" id="exportBtn">Eksport kopii</button>
    <button class="btn ghost" id="importBtn">Wczytaj kopię</button>
    <input class="hidden" type="file" id="importFile" accept="application/json">
  </div>
  <div id="projectList" class="grid"></div>
  <p class="notice">Dane i zdjęcia są zapisywane w pamięci tej przeglądarki na tym urządzeniu. Regularnie rób eksport kopii zapasowej, szczególnie przed zmianą telefonu lub czyszczeniem danych przeglądarki.</p>
</main>
<div id="modalRoot"></div>
<script>
const DB_NAME='moje-robotki-db', STORE='projects'; let db;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(p){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(p);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmt(d){return new Date(d).toLocaleDateString('pl-PL')}
async function photoData(file){if(!file)return ''; if(!file.type.startsWith('image/'))throw Error('Wybierz plik graficzny.'); return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,1400/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=url})}
async function render(){const projects=(await all()).sort((a,b)=>b.updated-a.updated),q=$('#search').value.toLowerCase(),f=$('#filter').value;const shown=projects.filter(p=>(!f||p.status===f)&&(`${p.name} ${p.type} ${p.notes}`.toLowerCase().includes(q)));$('#projectList').innerHTML=shown.length?shown.map(p=>{const last=(p.sessions||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0];return `<article class="card">${p.photo?`<img class="cover" src="${p.photo}" alt="Zdjęcie projektu ${esc(p.name)}">`:`<div class="cover" style="display:grid;place-items:center;font-size:54px">🧶</div>`}<div class="cardbody"><div class="rowline"><span class="pill">${esc(p.status)}</span><span class="muted">${esc(p.type||'Robótka')}</span></div><h2>${esc(p.name)}</h2><div class="meta">${p.hook?`Szydełko/druty: ${esc(p.hook)} · `:''}${p.size?`Rozmiar: ${esc(p.size)}`:''}</div><div class="rowline"><strong>Ostatni rząd: ${esc(p.row||'—')}</strong><span class="muted">${last?`Sesja: ${fmt(last.date)}`:'Brak sesji'}</span></div><div class="cardbuttons"><button class="btn" onclick="sessionForm('${p.id}')">＋ Dodaj postęp</button><button class="btn secondary" onclick="detail('${p.id}')">Szczegóły</button><button class="btn ghost" onclick="editProject('${p.id}')">Edytuj</button></div></div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1"><strong>Tu zaczyna się Twoja kreatywna pracownia ✨</strong>Dodaj pierwszą robótkę, zdjęcie i zapisz, na którym rzędzie jesteś.</div>`}
function modal(content){$('#modalRoot').innerHTML=`<div class="modalback" id="back"><section class="modal"><div class="modalhead"><h2>${content.title}</h2><button class="close" onclick="closeModal()" aria-label="Zamknij">×</button></div>${content.body}</section></div>`;$('#back').addEventListener('click',e=>{if(e.target.id==='back')closeModal()})}
function closeModal(){$('#modalRoot').innerHTML=''}
async function projectForm(id){const p=id?(await all()).find(x=>x.id===id):{name:'',type:'Szydełkowanie',status:'W trakcie',row:'',hook:'',size:'',yarn:'',pattern:'',notes:'',photo:''};modal({title:id?'Edytuj robótkę':'Nowa robótka',body:`<form id="projectForm"><div class="formgrid">
<div class="field"><label>Nazwa projektu *</label><input name="name" required value="${esc(p.name)}" placeholder="Np. kocyk, kardigan…"></div>
<div class="field"><label>Rodzaj</label><select name="type">${['Szydełkowanie','Robienie na drutach','Haft','Makrama','Inne'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Status</label><select name="status">${['W planach','W trakcie','Ukończone','Wstrzymane'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Rozmiar szydełka / drutów</label><input name="hook" value="${esc(p.hook)}" placeholder="Np. 4 mm"></div>
<div class="field"><label>Rozmiar projektu</label><input name="size" value="${esc(p.size)}" placeholder="Np. 80 × 100 cm"></div>
<div class="field"><label>Włóczka / materiały</label><input name="yarn" value="${esc(p.yarn)}"></div>
<div class="field"><label>Aktualny numer rzędu</label><input name="row" value="${esc(p.row)}" placeholder="Np. 24"></div>
<div class="field full"><label>Wzór / instrukcja</label><textarea name="pattern">${esc(p.pattern)}</textarea></div>
<div class="field full"><label>Notatki</label><textarea name="notes">${esc(p.notes)}</textarea></div>
<div class="field full"><label>Zdjęcie projektu</label><input type="file" name="photo" accept="image/*"><span class="muted">${p.photo?'Obecne zdjęcie zostanie zachowane, jeśli nie wybierzesz nowego.':''}</span></div>
</div><div class="actions"><button class="btn" type="submit">Zapisz robótkę</button><button class="btn ghost" type="button" onclick="closeModal()">Anuluj</button></div></form>`});$('#projectForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),old=id?(await all()).find(x=>x.id===id):null;let photo=old?.photo||'';try{if(fd.get('photo').size)photo=await photoData(fd.get('photo'));const obj={...(old||{}),id:id||uid(),name:fd.get('name').trim(),type:fd.get('type'),status:fd.get('status'),hook:fd.get('hook'),size:fd.get('size'),yarn:fd.get('yarn'),row:fd.get('row'),pattern:fd.get('pattern'),notes:fd.get('notes'),photo,updated:Date.now(),sessions:old?.sessions||[]};await put(obj);closeModal();render()}catch(err){alert('Nie udało się zapisać zdjęcia: '+err.message)}}}
async function sessionForm(id){const p=(await all()).find(x=>x.id===id);if(!p)return;modal({title:`Postęp: ${p.name}`,body:`<form id="sessionForm"><div class="formgrid"><div class="field"><label>Data sesji</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Na którym rzędzie skończyłaś? *</label><input name="row" required value="${esc(p.row)}" placeholder="Np. 28"></div><div class="field full"><label>Co udało się zrobić / notatka</label><textarea name="note" placeholder="Np. skończony rękaw, zmieniłam kolor…"></textarea></div><div class="field full"><label>Zdjęcie postępu (opcjonalnie)</label><input name="photo" type="file" accept="image/*"></div></div><p class="muted">Wpis zostanie dodany do historii. Wcześniejsze sesje nie zostaną nadpisane.</p><div class="actions"><button class="btn" type="submit">Zapisz sesję</button><button class="btn ghost" type="button" onclick="closeModal()">Anuluj</button></div></form>`});$('#sessionForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const ph=fd.get('photo').size?await photoData(fd.get('photo)):'';const prev=Number(String(p.row).replace(',','.')),next=Number(String(fd.get('row')).replace(',','.'));const entry={id:uid(),date:fd.get('date'),row:fd.get('row').trim(),delta:Number.isFinite(prev)&&Number.isFinite(next)?next-prev:null,note:fd.get('note'),photo:ph,created:Date.now()};p.sessions=p.sessions||[];p.sessions.push(entry);p.row=entry.row;p.updated=Date.now();await put(p);closeModal();render()}catch(err){alert('Nie udało się zapisać sesji: '+err.message)}}}
async function detail(id){const p=(await all()).find(x=>x.id===id);if(!p)return;const sessions=(p.sessions||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);modal({title:p.name,body:`${p.photo?`<img src="${p.photo}" style="width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin-bottom:12px">`:''}<p><b>${esc(p.type)}</b> · ${esc(p.status)}</p><p>**Wzór:** ${esc(p.pattern||'—')}<br><b>Szydełko/druty:</b> ${esc(p.hook||'—')}<br><b>Rozmiar:</b> ${esc(p.size||'—')}<br><b>Włóczka:</b> ${esc(p.yarn||'—')}<br><b>Aktualny rząd:</b> ${esc(p.row||'—')}</p><p>${esc(p.notes||'')}</p><hr><h3>Dziennik postępów (${sessions.length})</h3>${sessions.length?`<div class="progress">${sessions.map(s=>`<div class="entry"><div class="entryhead"><b>${fmt(s.date)} · rząd ${esc(s.row)}</b><span class="muted">${s.delta===null?'':s.delta>=0?`+${s.delta} rz.`:`${s.delta} rz.`}</span></div>${s.note?`<p>${esc(s.note)}</p>`:''}${s.photo?`<img src="${s.photo}" alt="Zdjęcie postępu">`:''}</div>`).join('')}</div>`:'<p class="muted">Nie ma jeszcze zapisanych sesji. Dodaj pierwszy postęp.</p>'}<div class="actions"><button class="btn" onclick="sessionForm('${p.id}')">＋ Dodaj postęp</button><button class="btn secondary" onclick="editProject('${p.id}')">Edytuj projekt</button><button class="btn danger" onclick="removeProject('${p.id}')">Usuń</button></div>`})}
async function editProject(id){closeModal();projectForm(id)}
async function removeProject(id){if(confirm('Usunąć tę robótkę razem z historią postępów?')){await del(id);closeModal();render()}}
async function exportData(){const data=await all(),blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),projects:data})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moje-robotki-kopia-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
async function importData(file){try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.projects))throw Error('Nieprawidłowy plik kopii.');if(!confirm('Wczytać kopię? Projekty o tych samych identyfikatorach zostaną zastąpione.'))return;for(const p of obj.projects){if(p.id&&p.name)await put(p)}render();alert('Kopia została wczytana.')}catch(e){alert('Nie udało się wczytać kopii: '+e.message)}}
$('#addBtn').onclick=()=>projectForm();$('#search').oninput=render;$('#filter').onchange=render;$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};
(async()=>{try{db=await openDB();await render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#projectList').innerHTML='<p>Ta przeglądarka nie obsługuje lokalnej bazy danych aplikacji.</p>'}})();
</script>
</body></html>
